function render(){document.body.classList.toggle('dark',dark);const m=$('#main');if(page==='dashboard')m.innerHTML=dashboard();else if(page==='library')m.innerHTML=library();else if(page==='themes')m.innerHTML=themesPage();else if(page==='reading')m.innerHTML=readingPage();else if(page==='backup')m.innerHTML=backupPage();else if(page==='detail')m.innerHTML=detailPage(records.find(r=>r.id===selectedId));wire()}
function dashboard(){const read=records.filter(r=>r.readStatus==='Selesai dibaca').length,doing=records.filter(r=>r.readStatus==='Sedang dibaca').length,ts={};records.forEach(r=>(r.themes||[]).forEach(t=>ts[t]=(ts[t]||0)+1));const top=Object.entries(ts).sort((a,b)=>b[1]-a[1]).slice(0,6);const recent=records.filter(r=>r.priority==='Tinggi'&&r.readStatus!=='Selesai dibaca').slice(0,5);return `<div class="stats"><div class="stat"><div class="muted">Total publikasi</div><div class="num">${records.length}</div><div class="muted">Data dari Excel 2021–2026</div></div><div class="stat"><div class="muted">Tema teridentifikasi</div><div class="num">${Object.keys(ts).length}</div><div class="muted">Klasifikasi dari judul</div></div><div class="stat"><div class="muted">Selesai dibaca</div><div class="num">${read}</div><div class="progress"><span style="width:${records.length?read/records.length*100:0}%"></span></div></div><div class="stat"><div class="muted">Sedang dibaca</div><div class="num">${doing}</div><div class="muted">Prioritas membaca</div></div></div><div class="layout" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><section class="panel"><h2>Topik dengan koleksi terbanyak</h2>${top.map(([t,n])=>`<div style="margin:12px 0;cursor:pointer" data-theme-click="${esc(t)}"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(t)}</strong><span>${n}</span></div><div class="progress"><span style="width:${n/Math.max(1,records.length)*100}%"></span></div></div>`).join('')||'<p class="muted">Belum ada tema.</p>'}<div class="actions"><button class="btn" data-go="themes">Buka peta tema</button></div></section><section class="panel"><h2>Mulai membaca</h2><p class="muted">Pilih artikel, buka tautan jurnal atau PDF lokal, lalu isi catatan telaah. Klasifikasi dari judul adalah saran awal dan dapat dikoreksi.</p><div class="actions"><button class="btn primary" data-go="library">Cari publikasi</button><button class="btn" data-go="reading">Daftar bacaan</button></div><div class="notice">Sitasi APA 7 dibuat dari metadata yang tersedia. Data penulis yang belum ada harus dilengkapi dan diperiksa terlebih dahulu.</div></section></div><section class="panel" style="margin-top:14px"><h2>Artikel prioritas</h2>${recent.length?recent.map(r=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">${titleCell(r)}<div class="actions"><button class="btn small" data-open="${r.id}">Buka catatan</button></div></div>`).join(''):'<div class="empty">Belum ada artikel prioritas tinggi. Tandai artikel penting dari halaman detail.</div>'}</section>`}
function library(){const years=[...new Set(records.map(r=>r.year))].sort();const status=[...new Set(records.map(r=>r.status).filter(Boolean))].sort();return `<section class="panel"><h2>Semua Publikasi</h2><div class="toolbar"><input id="q" type="search" placeholder="Cari judul, jurnal, tema, tahun…" value="${esc(query)}"><select id="year"><option value="">Semua tahun</option>${years.map(y=>`<option ${filterYear===y?'selected':''}>${y}</option>`).join('')}</select><select id="themeFilter"><option value="">Semua tema</option>${allThemes().map(t=>`<option ${filterTheme===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select id="statusFilter"><option value="">Semua status indeks</option>${status.map(s=>`<option ${filterStatus===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="muted" style="margin-bottom:10px">Menampilkan ${filtered().length} dari ${records.length} publikasi. Klik judul atau tombol detail untuk mengedit metadata dan catatan.</div><div class="tablewrap"><table><thead><tr><th>Judul / Jurnal</th><th>Tema otomatis</th><th>Status baca</th><th>Aksi</th></tr></thead><tbody>${filtered().map(r=>`<tr><td>${titleCell(r)}<div class="muted">${esc(r.month)}</div></td><td>${tags(r.themes)}<div>${tags(r.subthemes)}</div></td><td><span class="tag ${r.readStatus==='Selesai dibaca'?'gold':''}">${esc(r.readStatus)}</span></td><td><button class="btn small primary" data-open="${r.id}">Detail</button></td></tr>`).join('')}</tbody></table></div></section>`}
function allThemes(){return [...new Set(records.flatMap(r=>[...(r.themes||[]),...(r.subthemes||[])]))].sort()}
function themesPage(){const counts={};records.forEach(r=>(r.themes||[]).forEach(t=>{counts[t]??={n:0,subs:{}};counts[t].n++;(r.subthemes||[]).forEach(s=>counts[t].subs[s]=(counts[t].subs[s]||0)+1)}));return `<section class="panel"><h2>Peta Tema Penelitian</h2><p class="muted">Tema dan subtema disarankan otomatis dari judul. Satu artikel dapat mempunyai beberapa topik. Klasifikasi belum tentu mencerminkan seluruh isi artikel.</p><div class="cards">${Object.entries(counts).sort((a,b)=>b[1].n-a[1].n).map(([t,v])=>`<div class="theme-card" data-theme-click="${esc(t)}"><strong>${esc(t)}</strong><div class="muted">${v.n} artikel</div><div style="margin-top:8px">${Object.entries(v.subs).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([s,n])=>`<div class="muted">• ${esc(s)} (${n})</div>`).join('')}</div><div class="actions"><button class="btn small" data-filter-theme="${esc(t)}">Lihat artikel</button></div></div>`).join('')}</div><div class="notice">Untuk mengoreksi tema artikel, buka Detail → Klasifikasi. Kategori “Perlu Ditinjau” sengaja disediakan bagi judul yang belum jelas.</div></section>`}
function readingPage(){const list=records.filter(r=>r.readStatus!=='Selesai dibaca').sort((a,b)=>(a.priority==='Tinggi'?-1:0)-(b.priority==='Tinggi'?-1:0));return `<section class="panel"><h2>Daftar Bacaan</h2><div class="toolbar"><select id="readFilter"><option value="">Semua status membaca</option>${['Belum dibaca','Sedang dibaca','Selesai dibaca'].map(s=>`<option ${filterRead===s?'selected':''}>${s}</option>`).join('')}</select><input id="q" type="search" placeholder="Cari artikel atau tema…" value="${esc(query)}"></div><div class="notice">Pilih prioritas tinggi untuk artikel yang mendukung proposal, systematic review, atau manuskrip yang sedang dikerjakan.</div>${filtered().filter(r=>!filterRead||r.readStatus===filterRead).map(r=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)">${titleCell(r)}<div>${tags(r.themes)}<span class="tag ${r.priority==='Tinggi'?'gold':'gray'}">Prioritas ${esc(r.priority)}</span><span class="tag">${esc(r.readStatus)}</span></div><div class="actions"><button class="btn small primary" data-open="${r.id}">Baca / catat</button>${r.link?`<button class="btn small" data-url="${esc(r.link)}">Buka situs jurnal ↗</button>`:''}</div></div>`).join('')||'<div class="empty">Tidak ada artikel yang sesuai filter.</div>'}</section>`}
function detailPage(r){if(!r)return '<section class="panel">Artikel tidak ditemukan.</section>';const n=r.notes||{};return `<section class="panel"><div class="detail-head"><div><h2>${esc(r.title)}</h2><div class="muted">${esc(r.journal)} · ${esc(r.year)} · ${esc(r.month)}</div></div><button class="btn" data-go="library">← Kembali</button></div><div class="actions">${r.link?`<button class="btn primary" data-url="${esc(r.link)}">Buka situs jurnal ↗</button>`:''}<label class="btn" style="margin:0;cursor:pointer">Pilih PDF lokal <input id="pdfFile" type="file" accept="application/pdf" style="display:none"></label><button class="btn" id="copyCitation">Salin APA 7</button><button class="btn" id="copyInText">Salin sitasi dalam teks</button></div><div id="pdfNotice" class="muted"></div><div class="notice">PDF yang dipilih dibuka untuk sesi ini. Untuk akses berikutnya, simpan file PDF di folder perangkat yang mudah ditemukan. Situs jurnal memerlukan internet.</div><form id="detailForm"><h3>Metadata sitasi</h3><div class="formgrid"><div><label>Nama penulis (format APA)</label><input name="authors" value="${esc(r.authors||'')}" placeholder="Contoh: Prasetyawan, F., & Sari, N."></div><div><label>Tahun</label><input name="year" value="${esc(r.year)}"></div><div><label>Nama jurnal</label><input name="journal" value="${esc(r.journal)}"></div><div><label>Volume</label><input name="volume" value="${esc(r.volume||'')}"></div><div><label>Nomor/Issue</label><input name="issue" value="${esc(r.issue||'')}"></div><div><label>Halaman atau nomor artikel</label><input name="pages" value="${esc(r.pages||'')}"></div><div><label>DOI (tanpa https://doi.org/)</label><input name="doi" value="${esc(r.doi||'')}"></div><div><label>Tautan artikel</label><input name="link" value="${esc(r.link||'')}"></div></div><h3>Klasifikasi otomatis (dapat diedit)</h3><label>Tema utama — pisahkan dengan tanda titik koma (;)</label><input name="themes" value="${esc((r.themes||[]).join('; '))}"><label>Subtema — pisahkan dengan tanda titik koma (;)</label><input name="subthemes" value="${esc((r.subthemes||[]).join('; '))}"><label>Metode yang terdeteksi / dicatat — pisahkan dengan titik koma (;)</label><input name="methods" value="${esc((r.methods||[]).join('; '))}"><div class="formgrid"><div><label>Status membaca</label><select name="readStatus">${['Belum dibaca','Sedang dibaca','Selesai dibaca'].map(s=>`<option ${r.readStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Prioritas</label><select name="priority">${['Rendah','Normal','Tinggi'].map(s=>`<option ${r.priority===s?'selected':''}>${s}</option>`).join('')}</select></div></div><h3>Catatan telaah artikel</h3><div class="formgrid"><div><label>Tujuan penelitian</label><textarea name="objective">${esc(n.objective||'')}</textarea></div><div><label>Desain / metode penelitian</label><textarea name="method">${esc(n.method||'')}</textarea></div><div><label>Populasi / sampel</label><textarea name="sample">${esc(n.sample||'')}</textarea></div><div><label>Hasil utama</label><textarea name="findings">${esc(n.findings||'')}</textarea></div><div><label>Keterbatasan</label><textarea name="limitations">${esc(n.limitations||'')}</textarea></div><div><label>Relevansi untuk penelitian Anda</label><textarea name="relevance">${esc(n.relevance||'')}</textarea></div><div class="full"><label>Catatan kritis / ide lanjutan</label><textarea name="critical">${esc(n.critical||'')}</textarea></div></div><div class="actions"><button class="btn primary" type="submit">Simpan metadata & catatan</button><button class="btn" type="button" id="reclassify">Buat ulang saran tema dari judul</button></div></form><h3>Preview sitasi APA 7</h3><div class="panel" style="background:var(--ivory);box-shadow:none"><div id="citationPreview">${esc(cite(r)||'Lengkapi nama penulis dan nama jurnal untuk membentuk referensi APA 7. Jika tersedia, sitasi asli dari Excel tetap dapat ditampilkan di bawah.')}</div>${r.citationOriginal?`<details style="margin-top:10px"><summary>Sitasi asli dari Excel</summary><p>${esc(r.citationOriginal)}</p></details>`:''}<div class="muted" style="margin-top:8px">Periksa ejaan nama penulis, kapitalisasi judul, volume/issue, halaman, dan DOI terhadap artikel asli sebelum digunakan.</div></div></section>`}
function backupPage(){return `<section class="panel"><h2>Data & Cadangan</h2><div class="notice">Data disimpan di browser/perangkat ini. Jika browser dibersihkan atau perangkat diganti, data dapat hilang. Buat cadangan JSON secara berkala dan simpan di lokasi aman.</div><div class="actions"><button class="btn primary" id="exportJson">Ekspor cadangan JSON</button><button class="btn" id="importJson">Pulihkan dari JSON</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"><button class="btn" id="exportCsv">Ekspor CSV publikasi</button></div><h3>Ringkasan data</h3><p>${records.length} publikasi dalam basis data lokal. Sumber awal: file Excel publikasi 2021–2026.</p><h3>Catatan penting</h3><ul><li>Cadangan JSON mencakup metadata, klasifikasi, status membaca, dan catatan telaah.</li><li>File PDF yang dipilih dari perangkat tidak dimasukkan ke cadangan. Simpan PDF asli di folder perangkat atau cloud pribadi Anda.</li><li>Impor cadangan akan mengganti koleksi lokal saat ini. Ekspor dulu sebelum memulihkan cadangan lain.</li><li>Aplikasi ini tidak mengirim koleksi ke server.</li></ul><div class="actions"><button class="btn" id="reclassAll">Perbarui saran tema untuk artikel yang belum punya tema</button><button class="btn" id="resetApp">Kembalikan data awal dari Excel</button></div><div id="backupMsg" class="muted"></div></section>`}
function wire(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;selectedId=null;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));render()});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.open;page='detail';render()});
 document.querySelectorAll('[data-theme-click]').forEach(b=>b.onclick=()=>{filterTheme=b.dataset.themeClick;page='library';render()});
 document.querySelectorAll('[data-filter-theme]').forEach(b=>b.onclick=e=>{e.stopPropagation();filterTheme=b.dataset.filterTheme;page='library';render()});
 document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank','noopener'));
 const q=$('#q');if(q)q.oninput=()=>{query=q.value;const pos=q.selectionStart;const v=q.value;const m=$('#main');const oldPage=page;render();const nq=$('#q');if(nq){nq.focus();nq.value=v;try{nq.setSelectionRange(pos,pos)}catch(e){}}};
 const y=$('#year');if(y)y.onchange=()=>{filterYear=y.value;render()};
 const tf=$('#themeFilter');if(tf)tf.onchange=()=>{filterTheme=tf.value;render()};
 const sf=$('#statusFilter');if(sf)sf.onchange=()=>{filterStatus=sf.value;render()};
 const rf=$('#readFilter');if(rf)rf.onchange=()=>{filterRead=rf.value;render()};
 const form=$('#detailForm');if(form)form.onsubmit=async e=>{e.preventDefault();const r=records.find(x=>x.id===selectedId),fd=new FormData(form);['authors','year','journal','volume','issue','pages','doi','link','readStatus','priority'].forEach(k=>r[k]=String(fd.get(k)||'').trim());['themes','subthemes','methods'].forEach(k=>r[k]=String(fd.get(k)||'').split(';').map(s=>s.trim()).filter(Boolean));r.notes={};['objective','method','sample','findings','limitations','relevance','critical'].forEach(k=>r.notes[k]=String(fd.get(k)||'').trim());await saveAll();render();alert('Metadata dan catatan tersimpan di perangkat ini.')};
 const re=$('#reclassify');if(re)re.onclick=async()=>{const r=records.find(x=>x.id===selectedId),c=classify(r.title);r.themes=c.themes;r.subthemes=c.subs;r.methods=c.methods;await saveAll();render()};
 const pdf=$('#pdfFile');if(pdf)pdf.onchange=()=>{const f=pdf.files[0];if(!f)return;const u=URL.createObjectURL(f);const win=window.open(u,'_blank');$('#pdfNotice').textContent=`PDF dipilih: ${f.name}. File dibuka sementara; simpan PDF asli di perangkat untuk penggunaan berikutnya.`;if(!win)$('#pdfNotice').innerHTML=`Browser memblokir tab baru. <a href="${u}" target="_blank" rel="noopener">Buka PDF</a>`};
 const cc=$('#copyCitation');if(cc)cc.onclick=()=>copyText(cite(records.find(x=>x.id===selectedId))||'Lengkapi penulis dan jurnal dahulu.');
 const ci=$('#copyInText');if(ci)ci.onclick=()=>copyText(inText(records.find(x=>x.id===selectedId)));
 const ej=$('#exportJson');if(ej)ej.onclick=()=>download('fendy-research-library-backup.json',JSON.stringify({app:'Fendy Research Library',version:1,exportedAt:new Date().toISOString(),records},null,2),'application/json');
 const ec=$('#exportCsv');if(ec)ec.onclick=()=>{const cols=['id','year','month','title','journal','authors','reputation','status','link','doi','themes','subthemes','methods','readStatus','priority'];const csv=[cols.join(','),...records.map(r=>cols.map(k=>csvCell(Array.isArray(r[k])?r[k].join('; '):r[k])).join(','))].join('\r\n');download('fendy-research-library.csv','\ufeff'+csv,'text/csv;charset=utf-8')};
 const ij=$('#importJson');if(ij)ij.onclick=()=>$('#importFile').click();
 const inf=$('#importFile');if(inf)inf.onchange=async()=>{const f=inf.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const arr=Array.isArray(data)?data:data.records;if(!Array.isArray(arr))throw Error('Format cadangan tidak sesuai');if(!confirm(`Pulihkan ${arr.length} publikasi? Data lokal saat ini akan diganti.`))return;records=arr.map(r=>({...r,notes:r.notes||{},themes:r.themes||[],subthemes:r.subthemes||[],methods:r.methods||[]}));await saveAll();render();alert('Cadangan berhasil dipulihkan.')}catch(e){alert('Gagal membaca cadangan: '+e.message)}};
 const ra=$('#reclassAll');if(ra)ra.onclick=async()=>{records=records.map(r=>{const c=classify(r.title);if(!r.themes?.length||r.themes.includes('Perlu Ditinjau'))r.themes=c.themes;if(!r.subthemes?.length)r.subthemes=c.subs;if(!r.methods?.length)r.methods=c.methods;return r});await saveAll();render();$('#backupMsg').textContent='Saran tema diperbarui untuk artikel yang belum memiliki klasifikasi.'};
 const reset=$('#resetApp');if(reset)reset.onclick=async()=>{if(!confirm('Kembalikan data awal dari Excel? Semua perubahan, catatan, dan status membaca saat ini akan hilang kecuali sudah dicadangkan.'))return;records=INITIAL.map(applyClass);await saveAll();render()};
 const db=$('#darkBtn');if(db)db.onclick=()=>{dark=!dark;render()};
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function copyText(s){try{await navigator.clipboard.writeText(s);alert('Teks disalin.')}catch(e){prompt('Salin teks berikut:',s)}}
init();
</script></body></html>
